<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloto Dashboard</title>
    <script>
      (function(){
        var p=localStorage.getItem('cloto-theme');
        // Mirrors useThemeProvider: dark unless the user chose otherwise; `system`
        // and `legacy` follow the OS, and `legacy` swaps in the old palette.
        var os=window.matchMedia('(prefers-color-scheme:dark)').matches;
        if(p==='dark'||!p||((p==='system'||p==='legacy')&&os))
          document.documentElement.classList.add('dark');
        if(p==='legacy') document.documentElement.classList.add('theme-legacy');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
