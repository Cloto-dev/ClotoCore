<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloto Dashboard</title>
    <script>
      (function(){
        // Before React, so the first paint is already the chosen theme. Mirrors
        // hooks/useTheme.ts + themes/apply.ts: the mode (dark unless chosen
        // otherwise; `system` follows the OS), the face a one-face theme forces,
        // and the stylesheet the last apply generated from validated values.
        try {
          var ls=localStorage;
          var m=ls.getItem('cloto-theme-mode')||ls.getItem('cloto-theme');
          var f=ls.getItem('cloto-theme-face');
          var os=window.matchMedia('(prefers-color-scheme:dark)').matches;
          var dark=f?f==='dark':(m==='light'?false:(!m||m==='dark')?true:os);
          if(dark) document.documentElement.classList.add('dark');
          var css=ls.getItem('cloto-theme-css');
          if(css){
            var el=document.createElement('style');
            el.id='cloto-theme';
            el.textContent=css;
            document.head.appendChild(el);
          }
        } catch(e) { document.documentElement.classList.add('dark'); }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
