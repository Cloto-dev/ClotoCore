[package]
name = "app"
version.workspace = true
description = "ClotoCore Desktop Application"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2"
# Rfc3339 formatting of the updater's release date (same `time` the updater
# plugin already pulls in — this only turns on the `formatting` feature).
time = { version = "0.3", features = ["formatting"] }

# Screen capture
xcap = "0.9"
image = "0.25"
base64 = "0.21"

# ClotoCore Kernel (provides axum, tower-http, tokio, tracing, etc.)
cloto_core = { path = "../../crates/core" }
dotenvy = "0.15"
rand = "0.8"

# Headless `--smoke` release-gate self-check: own async runtime + raw-TCP health
# probe (no HTTP-client/TLS dep for a loopback call). Feature set unions with the
# kernel's `tokio = full`, so this adds no extra build cost.
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "io-util", "sync"] }
