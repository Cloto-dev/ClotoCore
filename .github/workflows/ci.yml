name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          shared-key: ci-lint

      - name: Create dashboard dist placeholder
        run: |
          mkdir -p dashboard/dist
          echo '<html><body></body></html>' > dashboard/dist/index.html

      - name: Check formatting
        run: cargo fmt --all -- --check

      # --all-targets also lints tests, benches and examples. Without it these
      # rot unnoticed: 12 violations had accumulated there behind a local gate
      # that was permanently red for an unrelated reason (an earlier decision).
      - name: Run clippy
        run: cargo clippy --workspace --exclude app --all-targets -- -D warnings -A clippy::too-many-lines -A clippy::struct-excessive-bools -A clippy::match-same-arms -A clippy::cast-possible-wrap -A clippy::trivially-copy-pass-by-ref -A clippy::manual-let-else -A clippy::option-if-let-else -A clippy::case-sensitive-file-extension-comparisons -A clippy::unwrap-used -A clippy::type-complexity

      # scripts/lint-rust.sh derives the local lint gate from the step above so
      # the allowlist is never hand-copied. If that step is reshaped (renamed,
      # `run:` turned multiline) the script fails closed — but only for whoever
      # runs it locally, which is how the gate rotted last time. Assert here that
      # the derivation still works and still carries --all-targets. No compile.
      - name: lint-rust.sh self-check
        run: |
          derived="$(bash scripts/lint-rust.sh --print)"
          echo "derived: $derived"
          case "$derived" in
            *" --all-targets "*) ;;
            *)
              echo "::error::lint-rust.sh derived a command without --all-targets" >&2
              exit 1
              ;;
          esac

      - name: Feed generator self-test
        run: python3 scripts/generate-release-feed.py --selftest

      # The opverify ledger only runs on the nightly / on a VM, so its logic
      # (apex distillation, per-tier baseline isolation) has no other gate.
      - name: opverify ledger self-test
        run: python3 -m scripts.opverify.ledger_selftest

      # Same reason: the visual apex loop (dual-oracle tiering, settle,
      # runtime-derived danger-zone questions) otherwise only executes on a
      # live VM run.
      - name: opverify visual self-test
        run: python3 -m scripts.opverify.visual.selftest

      # The other five visual suites were written and then never wired to
      # anything: `visual.selftest` was the only one CI ran, so the transport
      # backends — where a 403 was being handed back as if it were state
      # (bug-500) — had no gate at all. None of them needs a VM; they are the
      # same class of pure-logic test as the step above.
      - name: opverify transport self-test
        run: python3 -m scripts.opverify.visual.tunnel_selftest

      - name: opverify co-fetch self-test
        run: python3 -m scripts.opverify.visual.cofetch_selftest

      - name: opverify live-assessor self-test
        run: python3 -m scripts.opverify.visual.live_assessor_selftest

      - name: opverify assessor-cache self-test
        run: python3 -m scripts.opverify.visual.assessor_cache_selftest

      - name: opverify deploy-agent self-test
        run: python3 -m scripts.opverify.visual.deploy_agent_selftest

      - name: opverify affordance-coverage self-test
        run: python3 -m scripts.opverify.visual.affordance_coverage_selftest

      - name: opverify census self-test
        run: python3 -m scripts.opverify.visual.census_selftest

      - name: Language pack checker self-test
        run: python3 scripts/check-language-packs.py --selftest

      # Blocking from the start: an untranslated key is invisible at runtime
      # (fallbackLng resolves it to English) and invisible in the component
      # tests (they assert against the English bundle), which is how the ja pack
      # drifted to 103 missing keys and shipped an English Danger Zone. An
      # advisory warning here would be read by exactly nobody.
      - name: Language pack coverage gate
        run: python3 scripts/check-language-packs.py --verbose

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          shared-key: ci-audit

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Run cargo audit
        run: cargo audit

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        include:
          # Windows is the real cross-platform blind spot (CRLF / path / process
          # spawning). Added non-blocking first (experimental) to surface divergence
          # without holding PRs hostage; flip to blocking once green. macOS is the
          # dev platform (continuously dogfooded) so it is intentionally omitted here.
          - os: windows-latest
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    # Per-compilation-unit object cache: rust-cache's target archive restores
    # only on an exact key match (Cargo.lock hash), so every dependency bump
    # recompiled the whole tree; sccache keys per unit, so only changed crates
    # recompile. rust-cache stays for the registry/git caches (cache-targets
    # off) — the full target archives were crowding the repo's 10 GB Actions
    # cache quota (measured at 9.5 GB with release archives already evicted).
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          shared-key: ci-test-${{ matrix.os }}
          cache-targets: false

      - name: Create dashboard dist placeholder
        shell: bash
        run: |
          mkdir -p dashboard/dist
          echo '<html><body></body></html>' > dashboard/dist/index.html

      - name: Run tests
        run: cargo test --workspace --exclude app
        env:
          RUST_LOG: warn

      - name: Test count ratchet
        if: matrix.os == 'ubuntu-latest'
        # `rust` explicitly: this job has no Node, and a ratchet that skips the
        # suite it cannot measure is how a floor stops holding anything. The
        # dashboard floor is checked in the Dashboard job, which has Node.
        run: bash scripts/check-test-count.sh rust

  smoke:
    name: Smoke (${{ matrix.os }})
    # Release-gate keystone (harness-engineering FACET 2): build the real `app`
    # binary and run `app --smoke`, which boots the kernel headlessly — no window,
    # no display, since the smoke exits before the Tauri event loop — and asserts
    # the liveness route serves 200. The exit code IS the gate: this proves the
    # shipped binary *launches and wires up* on each OS, not merely that it
    # compiled. Non-blocking (experimental) until green on both, mirroring `test`;
    # placement (per-PR vs pre-promotion) is an open item in the harness doctrine.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        include:
          - os: windows-latest
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    # sccache: same rationale as the test job (see its comment).
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          shared-key: ci-smoke-${{ matrix.os }}
          cache-targets: false

      # Build-time only — `app --smoke` never initializes GTK/WebKit at runtime
      # (it exits before the Tauri builder), so no xvfb/display is needed to run it.
      # Dep list matches release.yml so the smoke exercises the release build surface.
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libpipewire-0.3-dev \
            libgbm-dev libegl-dev libxcb1-dev

      - name: Create dashboard dist placeholder
        shell: bash
        run: |
          mkdir -p dashboard/dist
          echo '<html><body></body></html>' > dashboard/dist/index.html

      - name: Build app
        run: cargo build --package app

      - name: Run headless smoke (kernel boot + health 200; exit code is the gate)
        run: cargo run --package app -- --smoke
        env:
          RUST_LOG: warn

  verify-issues:
    name: Issue Registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify issue registry
        run: bash scripts/verify-issues.sh

  nsis-hook-gate:
    name: NSIS Hook Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify installer.nsh hook integrity (bug-386)
        run: bash scripts/check-nsis-hook.sh

  sentinel:
    name: Sentinel
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2  # Need HEAD~1 for diff
      - name: Run sentinel checks
        run: bash scripts/sentinel.sh

  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'push'  # master push only, skip PRs
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          shared-key: ci-mutation
      - name: Create dashboard dist placeholder
        run: |
          mkdir -p dashboard/dist
          echo '<html><body></body></html>' > dashboard/dist/index.html
      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants
      - name: Run mutation testing
        run: cargo mutants --workspace --exclude app --timeout 120 --jobs 2 2>&1 | tee mutation-report.txt
        continue-on-error: true  # Don't block CI yet, build confidence first
      - name: Upload mutation report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: mutation-report
          path: mutation-report.txt
          retention-days: 30

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint (Biome)
        run: npx biome lint src/

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test -- --run --passWithNoTests

      - name: Test count ratchet
        # `--passWithNoTests` above means a suite that vanished still passes.
        # The ratchet is what notices: it reads the count back and compares it
        # against the floor in qa/test-baseline.json.
        working-directory: ${{ github.workspace }}
        run: bash scripts/check-test-count.sh dashboard
