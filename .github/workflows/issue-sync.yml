name: Issue Registry ↔ GitHub Sync

on:
  pull_request:
    types: [closed]
    branches: [master]
    paths:
      - "qa/issue-registry.json"

jobs:
  sync-issues:
    name: Sync Registry ↔ GitHub Issues
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Sync issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/sync-issues-to-github.sh
