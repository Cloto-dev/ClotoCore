<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>チャット (空) v2 — ClotoCore</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ---------- Decisions (each line says why) — see docs/DESIGN_PHILOSOPHY.md ---------- */
:root {
  /* 中立色: slate を捨て、相手の色相 (cyan, h≈190) を 4% 混ぜた墨。4 段の階段を数値で固定 */
  --h: 190;
  --ink-0: hsl(var(--h) 6% 8%);   /* 基底 (作業領域) */
  --ink-1: hsl(var(--h) 7% 12%);  /* 後退面 (サイドバー) — 基底より明るく、作業領域が前に出る */
  --ink-2: hsl(var(--h) 7% 16%);  /* 浮いた面 (composer・hover) */
  --ink-3: hsl(var(--h) 7% 22%);  /* 境界の代わりに使う明度 (罫線は引かない) */
  --fg-0: hsl(var(--h) 10% 92%);  /* 本文 */
  --fg-1: hsl(var(--h) 8% 68%);   /* 補助 */
  --fg-2: hsl(var(--h) 6% 48%);   /* 後退 */
  /* アクセント: いま話している相手の色。装飾に使わず、相手に属するもの (顔・発言・送信・選択) だけ */
  --agent: hsl(190 70% 58%);
  --agent-ink: hsl(190 50% 10%);
  --agent-dim: hsl(190 40% 58% / .16);
  --agent-name: "サフィー";
  /* 角丸 3 段: 道具 6 / 面 10 / composer 18 (唯一の柔らかい要素) */
  --r-tool: 6px; --r-face: 10px; --r-soft: 18px;
  --reading: 720px;
  --sans: "IBM Plex Sans JP", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace; /* 数値・コードだけ */
}
* { box-sizing: border-box; } html, body { margin: 0; height: 100%; }
body { background: var(--ink-0); color: var(--fg-0); font-family: var(--sans); font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; } button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--agent); outline-offset: 2px; border-radius: var(--r-tool); }
::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: var(--ink-3); border-radius: 8px; border: 3px solid var(--ink-0); }
svg { width: 15px; height: 15px; flex: none; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.shell { display: grid; grid-template-columns: 264px 1fr; height: 100vh; overflow: hidden; }

/* ---------- サイドバー: 後退する面。色は無し、アイコンはナビだけ ---------- */
.side { background: var(--ink-1); display: flex; flex-direction: column; min-height: 0; padding: 14px 10px 10px; }
.side-head { display: flex; align-items: center; padding: 2px 8px 10px; }
.side-head .app { font-weight: 600; font-size: 14px; letter-spacing: 0; flex: 1; color: var(--fg-1); }
.side-head button { width: 30px; height: 30px; border-radius: var(--r-tool); display: grid; place-items: center; color: var(--fg-2); }
.side-head button:hover { background: var(--ink-2); color: var(--fg-0); }
.newchat { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--r-tool); font-weight: 500; text-align: left; width: 100%; color: var(--fg-0); }
.newchat:hover { background: var(--ink-2); }
.newchat .kbd { margin-left: auto; font-size: 12px; color: var(--fg-2); }
.convs { flex: 1; overflow-y: auto; min-height: 0; margin-top: 10px; }
.glabel { font-size: 12px; color: var(--fg-2); padding: 14px 10px 4px; }
.glabel:first-child { padding-top: 4px; }
.conv { display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left; padding: 6px 10px; border-radius: var(--r-tool); color: var(--fg-1); font-size: 13.5px; line-height: 1.5; }
.conv:hover { background: var(--ink-2); color: var(--fg-0); }
.conv .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv .who { font-size: 12px; color: var(--fg-2); flex: none; }
.conv.mine .who { color: var(--agent); }           /* いま話している相手との会話だけ、相手の色で名を出す */
.conv .live { width: 6px; height: 6px; border-radius: 50%; background: var(--agent); flex: none; align-self: center; }
.folder { padding-left: 12px; }
.more { color: var(--fg-2); font-size: 13px; padding: 6px 10px; }
.nav { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--ink-2); }
.nav a { display: flex; align-items: center; gap: 9px; padding: 6px 10px; border-radius: var(--r-tool); color: var(--fg-1); text-decoration: none; font-size: 13.5px; }
.nav a svg { width: 14px; height: 14px; color: var(--fg-2); }
.nav a:hover { background: var(--ink-2); color: var(--fg-0); }
.nav a.on { color: var(--fg-0); background: var(--ink-2); }
.side-foot { padding: 10px 10px 2px; font-size: 12px; color: var(--fg-2); display: flex; gap: 8px; }
.side-foot .ok { color: var(--fg-1); }

/* ---------- 居間: 相手がいる面 ---------- */
.room { display: flex; flex-direction: column; min-height: 0; }
.face { display: flex; align-items: center; gap: 14px; padding: 18px 28px 14px; }
.face .pic { width: 44px; height: 44px; border-radius: 50%; background: var(--agent); color: var(--agent-ink); display: grid; place-items: center; overflow: hidden; }
.face .pic svg { width: 26px; height: 26px; }
.face .who { line-height: 1.35; }
.face .name { font-size: 17px; font-weight: 600; }
.face .state { font-size: 13px; color: var(--fg-1); }
.face .state b { color: var(--agent); font-weight: 500; }
.face .spacer { flex: 1; }
.face .tool { color: var(--fg-2); width: 32px; height: 32px; border-radius: var(--r-tool); display: grid; place-items: center; }
.face .tool:hover { background: var(--ink-2); color: var(--fg-0); }

.stream { flex: 1; overflow-y: auto; min-height: 0; }
.col { width: min(var(--reading), 100% - 56px); margin: 0 auto; }
.said { display: flex; gap: 14px; padding-top: 28px; }
.said .mark { width: 8px; height: 8px; border-radius: 50%; background: var(--agent); margin-top: 11px; flex: none; }
.said .body { font-size: 16px; line-height: 1.8; }
.said .body p { margin: 0 0 .6em; } .said .body p:last-child { margin: 0; }
.said .when { font-size: 12px; color: var(--fg-2); margin-top: 6px; }
.threads { margin-top: 36px; }
.threads .h { font-size: 12.5px; color: var(--fg-2); padding-bottom: 6px; }
.threads a { display: flex; align-items: baseline; gap: 12px; padding: 9px 0; color: var(--fg-1); text-decoration: none; border-top: 1px solid var(--ink-2); }
.threads a:hover { color: var(--fg-0); }
.threads a .t { flex: 1; }
.threads a .d { font-size: 12.5px; color: var(--fg-2); flex: none; }

.write { padding: 12px 0 14px; }
.box { background: var(--ink-2); border-radius: var(--r-soft); padding: 12px 14px 10px; }  /* 境界なし・影なし: 明度だけで浮かせる */
.box:focus-within { box-shadow: 0 0 0 1px var(--ink-3); }
.box textarea { width: 100%; background: none; border: 0; outline: none; resize: none; min-height: 48px; max-height: 240px; font-size: 15.5px; line-height: 1.7; padding: 4px 4px 2px; color: var(--fg-0); }
.box textarea::placeholder { color: var(--fg-2); }
.row { display: flex; align-items: center; gap: 2px; margin-top: 6px; }
.row .ib { width: 32px; height: 32px; border-radius: var(--r-tool); display: grid; place-items: center; color: var(--fg-1); }
.row .ib:hover { background: var(--ink-3); color: var(--fg-0); }
.row .ctx { display: flex; align-items: center; gap: 6px; padding: 0 8px; font-size: 13px; color: var(--fg-1); height: 32px; border-radius: var(--r-tool); }
.row .ctx:hover { background: var(--ink-3); }
.row .ctx .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--agent); }
.row .sep { width: 1px; height: 16px; background: var(--ink-3); margin: 0 6px; }
.row .spacer { flex: 1; }
.row .meter { font-size: 12px; color: var(--fg-2); margin-right: 8px; }
.send { width: 32px; height: 32px; border-radius: 50%; background: var(--agent); color: var(--agent-ink); display: grid; place-items: center; }
.send svg { width: 16px; height: 16px; } .send:hover { filter: brightness(1.08); }
.hint { font-size: 12px; color: var(--fg-2); padding: 8px 4px 0; }
.face.slim { padding: 12px 20px 0; }
.stream.empty { display: flex; }
.presence { display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 6vh; }
.presence .pic { width: 84px; height: 84px; border-radius: 50%; background: var(--agent); color: var(--agent-ink); display: grid; place-items: center; margin-bottom: 16px; }
.presence .pic svg { width: 44px; height: 44px; }
.presence .name { font-size: 22px; font-weight: 600; line-height: 1.3; }
.presence .state { font-size: 13.5px; color: var(--fg-1); margin-top: 2px; }
.presence .state b { color: var(--agent); font-weight: 500; }
.presence .remark { font-size: 16px; color: var(--fg-0); margin: 22px 0 0; max-width: 34em; text-align: center; line-height: 1.8; }
.presence .threads { width: min(520px, 100%); margin-top: 40px; }
.presence .threads .h { text-align: center; }
.tag { position: fixed; left: 278px; bottom: 10px; font-size: 11.5px; color: var(--fg-2); }
</style><!-- Static UI sample. No backend, no interaction. Strings are the ja locale; see README.md in this folder. -->
</head><body><div class="shell">

<aside class="side">
  <div class="side-head"><span class="app">ClotoCore</span>
    <button title="検索 (⌘K)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <button title="通知"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg></button>
  </div>
  <button class="newchat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="width:14px;height:14px;color:var(--fg-2)"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>新しいチャット<span class="kbd">⌘N</span></button>
  <div class="convs">
    <div class="glabel">今日</div>
    <button class="conv mine"><span class="t">CPersona 2.6 の recall 精度整理</span><span class="who">サフィー</span></button>
    <button class="conv"><span class="t">Discord への朝の挨拶を自動化</span><span class="live" title="応答中"></span><span class="who">カリン</span></button>
    <button class="conv"><span class="t">テストメッセージと接続確認</span><span class="who">Cloto</span></button>
    <div class="glabel">プロジェクト</div>
    <button class="conv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:14px;height:14px;color:var(--fg-2);align-self:center"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg><span class="t">小説の下書き</span><span class="who">3 件</span></button>
    <div class="folder"><button class="conv"><span class="t">第 3 章の構成</span><span class="who">Cloto</span></button><button class="conv mine"><span class="t">登場人物のメモ</span><span class="who">サフィー</span></button></div>
    <div class="glabel">昨日</div>
    <button class="conv"><span class="t">MCP サーバの再起動が遅い件</span><span class="who">Cloto</span></button>
    <button class="conv"><span class="t">ベンチマーク N=10 の集計</span><span class="who">Benchmark</span></button>
    <div class="glabel">過去 7 日</div>
    <button class="conv"><span class="t">LM Studio 経由での要約テスト</span><span class="who">LM Studio</span></button>
    <button class="conv"><span class="t">cron の通知が二重に届く</span><span class="who">Cloto</span></button>
    <button class="conv mine"><span class="t">雑談部屋のログ整理</span><span class="who">サフィー</span></button>
    <button class="more">もっと表示する</button>
  </div>
  <nav class="nav">
    <a href="#" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H8l-4 4Z"/></svg>チャット</a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0 1 14 0M16 4a3.5 3.5 0 0 1 0 7M22 20a6 6 0 0 0-4-5.7"/></svg>エージェント</a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/></svg>MCP</a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 3a3 3 0 0 0-3 3v1a3 3 0 0 0-2 5 3 3 0 0 0 2 5v1a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3ZM15 3a3 3 0 0 1 3 3v1a3 3 0 0 1 2 5 3 3 0 0 1-2 5v1a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3Z"/></svg>メモリ</a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>設定</a>
  </nav>
  <div class="side-foot"><span class="ok">カーネル稼働中</span><span>5 体</span><span style="margin-left:auto" class="num">0.6.9-a.1</span></div>
</aside>

<main class="room">
  <header class="face slim">
    <span class="spacer"></span>
    <button class="tool" title="エージェントの設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button>
    <button class="tool" title="その他"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button>
  </header>

  <div class="stream empty"><div class="col presence">
    <div class="pic" title="VRM サムネイル (Sapphy V2)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="9" r="4"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></div>
    <div class="name">サフィー</div>
    <div class="state"><b>待機中</b>。2 時間前まで話していました</div>
    <p class="remark">おかえりなさい。続きでも、別の話でも大丈夫ですよ。</p>
    <div class="threads"><div class="h">続きから</div>
      <a href="#"><span class="t">CPersona 2.6 の recall 精度整理</span><span class="d">今日 14:02</span></a>
      <a href="#"><span class="t">登場人物のメモ</span><span class="d">昨日</span></a>
      <a href="#"><span class="t">雑談部屋のログ整理</span><span class="d">9 月 11 日</span></a>
    </div>
  </div></div>

  <div class="write"><div class="col">
    <div class="box">
      <textarea rows="1" placeholder="サフィーに話しかける"></textarea>
      <div class="row">
        <button class="ib" title="画像・ファイルを添付"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="ib" title="音声で話す"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <span class="sep"></span>
        <button class="ctx" title="相手を切り替える"><span class="dot"></span>サフィー</button>
        <button class="ctx" title="エンジン: 自動 (ollama)">自動</button>
        <span class="spacer"></span>
        <span class="meter num">12.4k / 128k</span>
        <button class="send" title="送信 (Enter)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </div>
    </div>
    <div class="hint">Enter で送信、Shift+Enter で改行</div>
  </div></div>
</main>
</div></body></html>
